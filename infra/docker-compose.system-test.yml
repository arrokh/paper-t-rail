name: paper-trail-system-test

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: papertrail
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: system-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrail -d papertrail"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [system-test]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [system-test]

  minio:
    image: paper-trail-system-test-minio:9e49d5e7a648
    build:
      context: ./minio-system-test
      args:
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    environment:
      MINIO_ROOT_USER: system-test-access
      MINIO_ROOT_PASSWORD: system-test-secret
    tmpfs:
      - /data:uid=10001,gid=10001,mode=1777
    networks: [system-test]

  minio-proxy:
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT}:9000"
    volumes:
      - ./minio-system-test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio: { condition: service_started }
    networks:
      system-test: {}
      minio-ingress: {}

  parser-fixtures:
    image: python:3.13.3-slim-bookworm
    command: ["python", "/fixtures/system_test_parser_fixtures.py"]
    volumes:
      - ../scripts/system_test_parser_fixtures.py:/fixtures/system_test_parser_fixtures.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/api/isalive', timeout=2); urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=2); urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      system-test:
        aliases: [grobid, docling, system-one-fixture]

  sqitch:
    image: sqitch/sqitch:v1.6.1.3
    profiles: [migration]
    working_dir: /repo
    volumes:
      - ../api/db:/repo:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [system-test]

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment: &backend-environment
      APP_ROLE: api
      APP_BIND_ADDRESS: ${SYSTEM_TEST_API_IP}
      API_DOCS_ENABLED: "false"
      JDBC_URL: jdbc:postgresql://postgres:5432/papertrail
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: system-test-only
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_HOST_PORT}
      S3_REGION: us-east-1
      S3_PATH_STYLE_ACCESS: "true"
      S3_ACCESS_KEY: system-test-access
      S3_SECRET_KEY: system-test-secret
      S3_BUCKET: system-test-source
      S3_BROWSER_UPLOAD_ALLOWED_ORIGINS: http://127.0.0.1:${WEB_HOST_PORT}
      GROBID_BASE_URL: http://grobid:8070
      GROBID_PARSER_VERSION: issue-55-fixture-v1
      DOCLING_BASE_URL: http://docling:5001
      CITED_PAPER_PARSER_VERSION: issue-55-fixture-v1
      DOCLING_REQUEST_TIMEOUT_MILLIS: "30000"
      CLAIM_ANALYSIS_DEFAULT_PROVIDER: heuristic
      RECORDED_SCHOLARLY_WORKS_RESOURCE: provider-fixtures/issue-55-recorded-scholarly-works.json
      SYSTEM_ONE_DEFAULT_PROVIDER: mock
      SYSTEM_ONE_AGGREGATION_ENABLED: "true"
      OPENAI_COMPATIBLE_ENABLED: "false"
      CROSSREF_ENABLED: "false"
      UNPAYWALL_ENABLED: "false"
      OLLAMA_ENABLED: "false"
      LAYA_ENABLED: "true"
      LAYA_BASE_URL: http://system-one-fixture:8000
      LAYA_API_KEY: system-test-fixture-only
      LAYA_TRUSTED_HOSTS: system-one-fixture
      JEV_API_KEY: ""
      PAPER_MIN_EXTRACTED_CHARACTERS: "100"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      parser-fixtures: { condition: service_healthy }
    networks:
      system-test:
        ipv4_address: ${SYSTEM_TEST_API_IP}

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      APP_BIND_ADDRESS: ${SYSTEM_TEST_WORKER_IP}
      API_DOCS_ENABLED: "false"
      REDIS_CONSUMER_NAME: system-test-worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      parser-fixtures: { condition: service_healthy }
    networks:
      system-test:
        ipv4_address: ${SYSTEM_TEST_WORKER_IP}

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      PAPER_T_RAIL_API_ORIGIN: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api: { condition: service_started }
    networks: [system-test]

  system-test-proxy:
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${API_HOST_PORT}:8080"
      - "127.0.0.1:${WEB_HOST_PORT}:3000"
    volumes:
      - ./minio-system-test/system-test-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }
    networks:
      system-test: {}
      host-ingress: {}

networks:
  system-test:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SYSTEM_TEST_SUBNET}
  minio-ingress:
    driver: bridge
  host-ingress:
    driver: bridge
