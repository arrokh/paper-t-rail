name: paper-t-rail

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail} -d ${POSTGRES_DB:-papertrail}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paper-trail]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-only-change-me}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-local-only-change-me}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paper-trail]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-local-minio-access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [paper-trail]

  grobid:
    image: ${GROBID_IMAGE:-grobid/grobid:0.9.1-crf}
    expose:
      - "8070"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8070/api/isalive | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 60s
    networks: [paper-trail]

  sqitch:
    image: sqitch/sqitch:v1.6.1.3
    profiles: [migration]
    working_dir: /repo
    volumes:
      - ../api/db:/repo:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [paper-trail]

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment: &backend-environment
      APP_ROLE: api
      APP_BIND_ADDRESS: 172.30.0.10
      API_DOCS_ENABLED: "true"
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-only-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-minio-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-source-documents}
      PAPER_MAX_UPLOAD_BYTES: ${PAPER_MAX_UPLOAD_BYTES:-52428800}
      PAPER_MAX_PAGES: ${PAPER_MAX_PAGES:-500}
      PAPER_MAX_EXTRACTED_CHARACTERS: ${PAPER_MAX_EXTRACTED_CHARACTERS:-5000000}
      PAPER_MAX_EXTRACTED_CHARACTERS_PER_PAGE: ${PAPER_MAX_EXTRACTED_CHARACTERS_PER_PAGE:-100000}
      PAPER_MAX_GROBID_RESPONSE_BYTES: ${PAPER_MAX_GROBID_RESPONSE_BYTES:-67108864}
      GROBID_PARSER_VERSION: ${GROBID_PARSER_VERSION:-0.9.1-crf}
      PAPER_MIN_EXTRACTED_CHARACTERS: ${PAPER_MIN_EXTRACTED_CHARACTERS:-100}
      PAPER_MIN_LANGUAGE_CONFIDENCE: ${PAPER_MIN_LANGUAGE_CONFIDENCE:-0.65}
      PAPER_MAX_REQUEST_SIZE: ${PAPER_MAX_REQUEST_SIZE:-51MB}
      PAPER_REFERENCE_RESOLUTION_CONFIDENCE_THRESHOLD: ${PAPER_REFERENCE_RESOLUTION_CONFIDENCE_THRESHOLD:-0.9}
      PAPER_RETRIEVAL_PROFILE_ID: ${PAPER_RETRIEVAL_PROFILE_ID:-postgres-hybrid-rrf-v1}
      PAPER_RETRIEVAL_VECTOR_CANDIDATES: ${PAPER_RETRIEVAL_VECTOR_CANDIDATES:-10}
      PAPER_RETRIEVAL_LEXICAL_CANDIDATES: ${PAPER_RETRIEVAL_LEXICAL_CANDIDATES:-10}
      PAPER_RETRIEVAL_FINAL_CANDIDATES: ${PAPER_RETRIEVAL_FINAL_CANDIDATES:-5}
      PAPER_RETRIEVAL_RRF_CONSTANT: ${PAPER_RETRIEVAL_RRF_CONSTANT:-60}
      CROSSREF_ENABLED: ${CROSSREF_ENABLED:-true}
      CROSSREF_ENABLEMENT_REVIEWED: ${CROSSREF_ENABLEMENT_REVIEWED:-true}
      CROSSREF_RETENTION_DISCLOSURE: ${CROSSREF_RETENTION_DISCLOSURE:-Crossref mencatat IP peminta dan isi permintaan. Email polite pool dipakai untuk pemecahan masalah, dan Crossref menyatakan log dihapus setelah tiga bulan.}
      CROSSREF_CONTACT_EMAIL: ${CROSSREF_CONTACT_EMAIL:-test@ptr.test}
      UNPAYWALL_ENABLED: ${UNPAYWALL_ENABLED:-true}
      UNPAYWALL_ENABLEMENT_REVIEWED: ${UNPAYWALL_ENABLEMENT_REVIEWED:-true}
      UNPAYWALL_RETENTION_DISCLOSURE: ${UNPAYWALL_RETENTION_DISCLOSURE:-Unpaywall menerima DOI dan alamat kontak layanan; kebijakannya menyebut data permintaan dapat disimpan hingga enam bulan setelah penggunaan layanan berakhir. Repositori/host konten yang ditemukan memiliki ketentuan retensi tersendiri.}
      UNPAYWALL_CONTACT_EMAIL: ${UNPAYWALL_CONTACT_EMAIL:-test@ptr.test}
      GROBID_BASE_URL: ${GROBID_BASE_URL:-http://grobid:8070}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    networks:
      paper-trail:
        ipv4_address: 172.30.0.10

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      APP_BIND_ADDRESS: 172.30.0.11
      API_DOCS_ENABLED: "false"
      REDIS_CONSUMER_NAME: worker-${HOSTNAME:-local}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      grobid: { condition: service_healthy }
    networks:
      paper-trail:
        ipv4_address: 172.30.0.11

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      PAPER_T_RAIL_API_ORIGIN: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_started }
    networks:
      paper-trail:
        ipv4_address: 172.30.0.20

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  paper-trail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
