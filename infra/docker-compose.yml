name: paper-t-rail

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail} -d ${POSTGRES_DB:-papertrail}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paper-trail]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-only-change-me}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-local-only-change-me}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paper-trail]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-local-minio-access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-minio-secret}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [paper-trail]

  grobid:
    image: ${GROBID_IMAGE:-grobid/grobid:0.9.1-crf}
    expose:
      - "8070"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8070/api/isalive | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 60s
    networks: [paper-trail]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.4}
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [paper-trail]

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.4}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$OLLAMA_ENABLED" = "true" ]; then
          exec /bin/ollama pull "$$OLLAMA_MODEL"
        fi
        echo "OLLAMA_ENABLED=false; skipping model download."
    environment:
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text:v1.5}
    depends_on:
      ollama: { condition: service_healthy }
    networks: [paper-trail]

  laya-model-download:
    profiles: [laya-evaluation]
    build:
      context: ..
      dockerfile: infra/laya/Dockerfile
    command: ["python", "/app/download_model.py"]
    environment:
      HF_HOME: /models/hf
    volumes:
      - laya_model_data:/models
    networks: [laya-download]

  laya:
    profiles: [laya-evaluation]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/laya/Dockerfile
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_DEVICE: cpu
      OMP_NUM_THREADS: ${LAYA_THREADS:-4}
      MKL_NUM_THREADS: ${LAYA_THREADS:-4}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - laya_model_data:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data.get('status') == 'ok' and 'typed-decisions' in data.get('loaded', [])"
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 120s
    networks: [laya-inference, laya-evaluation]

  laya-evaluator:
    profiles: [laya-evaluation]
    build:
      context: ..
      dockerfile: infra/laya/evaluator.Dockerfile
      args:
        PAPER_TRAIL_APPLICATION_REVISION: ${PAPER_TRAIL_APPLICATION_REVISION:-unversioned}
        PAPER_TRAIL_EVALUATOR_UID: ${PAPER_TRAIL_EVALUATOR_UID:-1000}
        PAPER_TRAIL_EVALUATOR_GID: ${PAPER_TRAIL_EVALUATOR_GID:-1000}
    user: ${PAPER_TRAIL_EVALUATOR_UID:-1000}:${PAPER_TRAIL_EVALUATOR_GID:-1000}
    working_dir: /workspace/api
    environment:
      LAYA_BASE_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_TRUSTED_HOSTS: laya
      LAYA_REQUEST_TIMEOUT_MILLIS: ${LAYA_REQUEST_TIMEOUT_MILLIS:-120000}
      PAPER_TRAIL_APPLICATION_REVISION: ${PAPER_TRAIL_APPLICATION_REVISION:-unversioned}
    volumes:
      - ${LAYA_EVALUATION_DIR:-../.laya-evaluation}:/evaluation:rw
    depends_on:
      laya: { condition: service_healthy }
    networks: [laya-evaluation]

  sqitch:
    image: sqitch/sqitch:v1.6.1.3
    profiles: [migration]
    working_dir: /repo
    volumes:
      - ../api/db:/repo:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [paper-trail]

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment: &backend-environment
      APP_ROLE: api
      APP_BIND_ADDRESS: 172.30.0.10
      API_DOCS_ENABLED: "true"
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-only-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-minio-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-source-documents}
      PAPER_MAX_UPLOAD_BYTES: ${PAPER_MAX_UPLOAD_BYTES:-52428800}
      PAPER_MAX_PAGES: ${PAPER_MAX_PAGES:-500}
      PAPER_MAX_CLAIM_CITATION_PAIRS: ${PAPER_MAX_CLAIM_CITATION_PAIRS:-5000}
      PAPER_MAX_EXTRACTED_CHARACTERS: ${PAPER_MAX_EXTRACTED_CHARACTERS:-5000000}
      PAPER_MAX_EXTRACTED_CHARACTERS_PER_PAGE: ${PAPER_MAX_EXTRACTED_CHARACTERS_PER_PAGE:-100000}
      PAPER_MAX_GROBID_RESPONSE_BYTES: ${PAPER_MAX_GROBID_RESPONSE_BYTES:-67108864}
      GROBID_PARSER_VERSION: ${GROBID_PARSER_VERSION:-0.9.1-crf}
      PAPER_MIN_EXTRACTED_CHARACTERS: ${PAPER_MIN_EXTRACTED_CHARACTERS:-100}
      PAPER_MIN_LANGUAGE_CONFIDENCE: ${PAPER_MIN_LANGUAGE_CONFIDENCE:-0.65}
      PAPER_MAX_REQUEST_SIZE: ${PAPER_MAX_REQUEST_SIZE:-51MB}
      PAPER_REFERENCE_RESOLUTION_CONFIDENCE_THRESHOLD: ${PAPER_REFERENCE_RESOLUTION_CONFIDENCE_THRESHOLD:-0.9}
      PAPER_RETRIEVAL_PROFILE_ID: ${PAPER_RETRIEVAL_PROFILE_ID:-postgres-hybrid-rrf-v1}
      PAPER_RETRIEVAL_VECTOR_CANDIDATES: ${PAPER_RETRIEVAL_VECTOR_CANDIDATES:-10}
      PAPER_RETRIEVAL_LEXICAL_CANDIDATES: ${PAPER_RETRIEVAL_LEXICAL_CANDIDATES:-10}
      PAPER_RETRIEVAL_FINAL_CANDIDATES: ${PAPER_RETRIEVAL_FINAL_CANDIDATES:-5}
      PAPER_RETRIEVAL_RRF_CONSTANT: ${PAPER_RETRIEVAL_RRF_CONSTANT:-60}
      CROSSREF_ENABLED: ${CROSSREF_ENABLED:-true}
      CROSSREF_ENABLEMENT_REVIEWED: ${CROSSREF_ENABLEMENT_REVIEWED:-true}
      CROSSREF_RETENTION_DISCLOSURE: ${CROSSREF_RETENTION_DISCLOSURE:-Crossref mencatat IP peminta dan isi permintaan. Email polite pool dipakai untuk pemecahan masalah, dan Crossref menyatakan log dihapus setelah tiga bulan.}
      CROSSREF_CONTACT_EMAIL: ${CROSSREF_CONTACT_EMAIL:-test@ptr.test}
      CROSSREF_CACHE_POSITIVE_TTL: ${CROSSREF_CACHE_POSITIVE_TTL:-30d}
      CROSSREF_CACHE_NEGATIVE_TTL: ${CROSSREF_CACHE_NEGATIVE_TTL:-1h}
      OPERATOR_API_CREDENTIAL: ${OPERATOR_API_CREDENTIAL:-}
      UNPAYWALL_ENABLED: ${UNPAYWALL_ENABLED:-true}
      UNPAYWALL_ENABLEMENT_REVIEWED: ${UNPAYWALL_ENABLEMENT_REVIEWED:-true}
      UNPAYWALL_RETENTION_DISCLOSURE: ${UNPAYWALL_RETENTION_DISCLOSURE:-Unpaywall menerima DOI dan alamat kontak layanan; kebijakannya menyebut data permintaan dapat disimpan hingga enam bulan setelah penggunaan layanan berakhir. Repositori/host konten yang ditemukan memiliki ketentuan retensi tersendiri.}
      UNPAYWALL_CONTACT_EMAIL: ${UNPAYWALL_CONTACT_EMAIL:-test@ptr.test}
      UNPAYWALL_CACHE_POSITIVE_TTL: ${UNPAYWALL_CACHE_POSITIVE_TTL:-24h}
      UNPAYWALL_CACHE_NEGATIVE_TTL: ${UNPAYWALL_CACHE_NEGATIVE_TTL:-1h}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text:v1.5}
      OLLAMA_DIMENSION: ${OLLAMA_DIMENSION:-768}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_TRUSTED_HOSTS: ${OLLAMA_TRUSTED_HOSTS:-ollama,localhost,127.0.0.1}
      OLLAMA_REQUEST_TIMEOUT_MILLIS: ${OLLAMA_REQUEST_TIMEOUT_MILLIS:-60000}
      OLLAMA_EXTERNAL_ENABLEMENT_REVIEWED: ${OLLAMA_EXTERNAL_ENABLEMENT_REVIEWED:-false}
      OLLAMA_EXTERNAL_RETENTION_DISCLOSURE: ${OLLAMA_EXTERNAL_RETENTION_DISCLOSURE:-}
      SYSTEM_ONE_DEFAULT_PROVIDER: ${SYSTEM_ONE_DEFAULT_PROVIDER:-laya}
      LAYA_ENABLED: ${LAYA_ENABLED:-true}
      LOCAL_LAYA_AGGREGATION_ENABLED: ${LOCAL_LAYA_AGGREGATION_ENABLED:-true}
      LOCAL_LAYA_AGGREGATION_DIRECT_SUPPORT_THRESHOLD: ${LOCAL_LAYA_AGGREGATION_DIRECT_SUPPORT_THRESHOLD:-0.80}
      LOCAL_LAYA_AGGREGATION_PARTIAL_SUPPORT_THRESHOLD: ${LOCAL_LAYA_AGGREGATION_PARTIAL_SUPPORT_THRESHOLD:-0.70}
      LOCAL_LAYA_AGGREGATION_CONTRADICTION_THRESHOLD: ${LOCAL_LAYA_AGGREGATION_CONTRADICTION_THRESHOLD:-0.80}
      LOCAL_LAYA_AGGREGATION_COMPARABILITY_MARGIN: ${LOCAL_LAYA_AGGREGATION_COMPARABILITY_MARGIN:-0.08}
      LAYA_BASE_URL: ${LAYA_BASE_URL:-http://laya:8000}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_TRUSTED_HOSTS: ${LAYA_TRUSTED_HOSTS:-laya,localhost,127.0.0.1}
      LAYA_REQUEST_TIMEOUT_MILLIS: ${LAYA_REQUEST_TIMEOUT_MILLIS:-120000}
      GROBID_BASE_URL: ${GROBID_BASE_URL:-http://grobid:8070}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      ollama-model-init: { condition: service_started }
    networks:
      paper-trail:
        ipv4_address: 172.30.0.10
      laya-inference: {}

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      APP_BIND_ADDRESS: 172.30.0.11
      API_DOCS_ENABLED: "false"
      REDIS_CONSUMER_NAME: worker-${HOSTNAME:-local}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      grobid: { condition: service_healthy }
      ollama-model-init: { condition: service_started }
    networks:
      paper-trail:
        ipv4_address: 172.30.0.11
      laya-inference: {}

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      PAPER_T_RAIL_API_ORIGIN: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_started }
    networks:
      paper-trail:
        ipv4_address: 172.30.0.20

  homepage:
    build:
      context: ..
      dockerfile: homepage/Dockerfile
      args:
        PUBLIC_WORKSPACE_URL: ${PUBLIC_WORKSPACE_URL:-http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:4321:80"
    networks:
      - paper-trail

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  laya_model_data:

networks:
  laya-download:
    driver: bridge
  laya-inference:
    internal: true
  laya-evaluation:
    internal: true
  paper-trail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
