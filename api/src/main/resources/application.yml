server:
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: paper-t-rail-${APP_ROLE:api}
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://127.0.0.1:5432/papertrail}
    username: ${POSTGRES_USER:papertrail}
    password: ${POSTGRES_PASSWORD:local-only-change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  servlet:
    multipart:
      max-file-size: ${PAPER_MAX_UPLOAD_BYTES:52428800}
      max-request-size: ${PAPER_MAX_REQUEST_SIZE:51MB}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

paper-trail:
  role: ${APP_ROLE:api}
  operator:
    credential: ${OPERATOR_API_CREDENTIAL:}
  upload:
    max-bytes: ${PAPER_MAX_UPLOAD_BYTES:52428800}
    max-pages: ${PAPER_MAX_PAGES:500}
    max-claim-citation-pairs: ${PAPER_MAX_CLAIM_CITATION_PAIRS:5000}
    max-extracted-characters: ${PAPER_MAX_EXTRACTED_CHARACTERS:5000000}
    max-extracted-characters-per-page: ${PAPER_MAX_EXTRACTED_CHARACTERS_PER_PAGE:100000}
    minimum-extracted-characters: ${PAPER_MIN_EXTRACTED_CHARACTERS:100}
    minimum-language-confidence: ${PAPER_MIN_LANGUAGE_CONFIDENCE:0.65}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:local-minio-access}
    secret-key: ${S3_SECRET_KEY:local-minio-secret}
    bucket: ${S3_BUCKET:source-documents}
  queue:
    stream: ${REDIS_STREAM:ae:pipeline}
    group: ${REDIS_CONSUMER_GROUP:ae-workers}
    consumer: ${REDIS_CONSUMER_NAME:${HOSTNAME:worker}}
    poll-delay-ms: ${REDIS_POLL_DELAY_MS:500}
    reclaim-delay-ms: ${REDIS_RECLAIM_DELAY_MS:30000}
    batch-size: ${REDIS_BATCH_SIZE:10}
    max-attempts: 3
    retry-backoff-ms: 250,1000,4000
  validation:
    parser-id: pdfbox
    parser-version: 3.0.5
    language-detector-id: optimaize
    language-detector-version: 0.6
  analysis:
    parser-id: grobid
    parser-version: ${GROBID_PARSER_VERSION:0.9.1-crf}
    parser-response-max-bytes: ${PAPER_MAX_GROBID_RESPONSE_BYTES:67108864}
    grobid-base-url: ${GROBID_BASE_URL:http://127.0.0.1:8070}
    reference-resolution-confidence-threshold: ${PAPER_REFERENCE_RESOLUTION_CONFIDENCE_THRESHOLD:0.9}
    retrieval:
      profile-id: ${PAPER_RETRIEVAL_PROFILE_ID:postgres-hybrid-rrf-v1}
      vector-candidates: ${PAPER_RETRIEVAL_VECTOR_CANDIDATES:10}
      lexical-candidates: ${PAPER_RETRIEVAL_LEXICAL_CANDIDATES:10}
      final-candidates: ${PAPER_RETRIEVAL_FINAL_CANDIDATES:5}
      rrf-constant: ${PAPER_RETRIEVAL_RRF_CONSTANT:60}
    cited-paper-max-bytes: ${PAPER_MAX_CITED_PAPER_BYTES:52428800}
    cited-paper-max-extracted-characters: ${PAPER_MAX_CITED_PAPER_EXTRACTED_CHARACTERS:5000000}
  # Local consent-flow/acquisition testing defaults. Deployments must verify terms and replace test values.
  providers:
    crossref:
      enabled: ${CROSSREF_ENABLED:true}
      enablement-reviewed: ${CROSSREF_ENABLEMENT_REVIEWED:true}
      retention-disclosure: "${CROSSREF_RETENTION_DISCLOSURE:Crossref mencatat IP peminta dan isi permintaan. Email polite pool dipakai untuk pemecahan masalah, dan Crossref menyatakan log dihapus setelah tiga bulan.}"
      contact-email: ${CROSSREF_CONTACT_EMAIL:test@ptr.test}
      cache:
        positive-ttl: ${CROSSREF_CACHE_POSITIVE_TTL:30d}
        negative-ttl: ${CROSSREF_CACHE_NEGATIVE_TTL:1h}
    unpaywall:
      enabled: ${UNPAYWALL_ENABLED:true}
      enablement-reviewed: ${UNPAYWALL_ENABLEMENT_REVIEWED:true}
      retention-disclosure: "${UNPAYWALL_RETENTION_DISCLOSURE:Unpaywall menerima DOI dan alamat kontak layanan; kebijakannya menyebut data permintaan dapat disimpan hingga enam bulan setelah penggunaan layanan berakhir. Repositori/host konten yang ditemukan memiliki ketentuan retensi tersendiri.}"
      contact-email: ${UNPAYWALL_CONTACT_EMAIL:test@ptr.test}
      cache:
        positive-ttl: ${UNPAYWALL_CACHE_POSITIVE_TTL:24h}
        negative-ttl: ${UNPAYWALL_CACHE_NEGATIVE_TTL:1h}
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:}
      model: ${OLLAMA_MODEL:}
      dimension: ${OLLAMA_DIMENSION:768}
      api-key: ${OLLAMA_API_KEY:}
      trusted-hosts: ${OLLAMA_TRUSTED_HOSTS:localhost,127.0.0.1}
      request-timeout-millis: ${OLLAMA_REQUEST_TIMEOUT_MILLIS:60000}
      external-enablement-reviewed: ${OLLAMA_EXTERNAL_ENABLEMENT_REVIEWED:false}
      external-retention-disclosure: "${OLLAMA_EXTERNAL_RETENTION_DISCLOSURE:}"
    laya:
      # Non-Compose and deployment default remains off; `make dev` explicitly enables the local sidecar.
      enabled: ${LAYA_ENABLED:false}
      base-url: ${LAYA_BASE_URL:}
      api-key: ${LAYA_API_KEY:}
      trusted-hosts: ${LAYA_TRUSTED_HOSTS:laya,localhost,127.0.0.1}
      request-timeout-millis: ${LAYA_REQUEST_TIMEOUT_MILLIS:120000}

scalar:
  enabled: ${API_DOCS_ENABLED:true}
  path: /scalar
  url: /v3/api-docs
  page-title: Paper T-Rail API Reference

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    com.papertrail.api: INFO
  structured:
    format:
      console: ecs
