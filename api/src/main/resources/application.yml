server:
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: paper-t-rail-${APP_ROLE:api}
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://127.0.0.1:5432/papertrail}
    username: ${POSTGRES_USER:papertrail}
    password: ${POSTGRES_PASSWORD:local-only-change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  servlet:
    multipart:
      max-file-size: ${PAPER_MAX_UPLOAD_BYTES:52428800}
      max-request-size: ${PAPER_MAX_REQUEST_SIZE:51MB}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

paper-trail:
  role: ${APP_ROLE:api}
  upload:
    max-bytes: ${PAPER_MAX_UPLOAD_BYTES:52428800}
    max-pages: ${PAPER_MAX_PAGES:500}
    max-extracted-characters: ${PAPER_MAX_EXTRACTED_CHARACTERS:5000000}
    max-extracted-characters-per-page: ${PAPER_MAX_EXTRACTED_CHARACTERS_PER_PAGE:100000}
    minimum-extracted-characters: ${PAPER_MIN_EXTRACTED_CHARACTERS:100}
    minimum-language-confidence: ${PAPER_MIN_LANGUAGE_CONFIDENCE:0.65}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:local-minio-access}
    secret-key: ${S3_SECRET_KEY:local-minio-secret}
    bucket: ${S3_BUCKET:source-documents}
  queue:
    stream: ${REDIS_STREAM:ae:pipeline}
    group: ${REDIS_CONSUMER_GROUP:ae-workers}
    consumer: ${REDIS_CONSUMER_NAME:${HOSTNAME:worker}}
    poll-delay-ms: ${REDIS_POLL_DELAY_MS:500}
    reclaim-delay-ms: ${REDIS_RECLAIM_DELAY_MS:30000}
    batch-size: ${REDIS_BATCH_SIZE:10}
    max-attempts: 3
    retry-backoff-ms: 250,1000,4000
  validation:
    parser-id: pdfbox
    parser-version: 3.0.5
    language-detector-id: optimaize
    language-detector-version: 0.6

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    com.papertrail.api: INFO
  structured:
    format:
      console: ecs
